<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Tarjeta digital profesional de Ricardo Soto, abogado."
    >

    <meta name="theme-color" content="#082c61">

    <title>Ricardo Soto | Abogado</title>


    <style>

        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {

            --azul: #082d63;
            --azul-oscuro: #041b3d;
            --azul-claro: #123f79;

            --dorado: #dba32c;
            --dorado-claro: #e9b641;

            --blanco: #ffffff;
            --gris: #dce5f0;

            --radio: 22px;

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

        }


        html {

            width: 100%;

            min-height: 100%;

            scroll-behavior: smooth;

        }


        body {

            width: 100%;
            min-height: 100vh;

            padding: 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-family:
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:

                radial-gradient(
                    circle at top left,
                    #254d80 0%,
                    #0a2d5d 40%,
                    #03152f 100%
                );

            color: var(--blanco);

            overflow-x: hidden;

        }


        /* =====================================================
           TARJETA
        ===================================================== */

        .business-card {

            position: relative;

            width: 100%;

            max-width: 1050px;

            min-height: 590px;

            overflow: hidden;

            border-radius: var(--radio);

            background:

                linear-gradient(
                    135deg,
                    rgba(18, 61, 120, 0.98),
                    rgba(3, 24, 55, 0.99)
                );

            box-shadow:

                0 25px 60px
                rgba(0, 0, 0, 0.35);

            border:
                1px solid
                rgba(255,255,255,0.08);

        }


        /* =====================================================
           DECORACIÓN
        ===================================================== */

        .business-card::before {

            content: "";

            position: absolute;

            width: 650px;
            height: 650px;

            right: -350px;
            top: -350px;

            border-radius: 50%;

            border:
                1px solid
                rgba(217,160,43,0.14);

            pointer-events: none;

        }


        .business-card::after {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            left: -350px;
            bottom: -350px;

            border-radius: 50%;

            background:
                rgba(217,160,43,0.04);

            pointer-events: none;

        }


        /* =====================================================
           CONTENIDO
        ===================================================== */

        .card-content {

            position: relative;

            display: grid;

            grid-template-columns:
                1fr
                430px;

            min-height: 590px;

        }


        /* =====================================================
           INFORMACIÓN
        ===================================================== */

        .information {

            position: relative;

            z-index: 2;

            padding:

                70px
                30px
                130px
                75px;

            display: flex;

            flex-direction: column;

            justify-content: center;

        }


        /* =====================================================
           NOMBRE
        ===================================================== */

        .name {

            font-size:
                clamp(40px, 5vw, 62px);

            line-height: 0.95;

            font-weight: 700;

            letter-spacing: -2px;

            color: var(--blanco);

        }


        .profession {

            margin-top: 12px;

            font-size:
                clamp(26px, 3vw, 38px);

            line-height: 1;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: var(--dorado-claro);

        }


        /* =====================================================
           LÍNEA DORADA
        ===================================================== */

        .gold-line {

            position: absolute;

            z-index: 5;

            left: 0;
            right: 0;

            top: 290px;

            height: 4px;

            background:

                linear-gradient(
                    90deg,
                    var(--dorado),
                    var(--dorado-claro),
                    var(--dorado)
                );

        }


        /* =====================================================
           CONTACTO
        ===================================================== */

        .contact-information {

            margin-top: 48px;

            display: flex;

            flex-direction: column;

            gap: 18px;

        }


        .contact-item {

            width: 100%;

            display: flex;

            align-items: center;

            gap: 14px;

            color: var(--blanco);

            text-decoration: none;

            font-size: 19px;

            line-height: 1.3;

            transition:
                transform 0.2s ease,
                color 0.2s ease;

        }


        .contact-item:hover {

            transform: translateX(5px);

            color: var(--dorado-claro);

        }


        .contact-icon {

            width: 40px;
            height: 40px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--blanco);

            color: var(--azul);

            font-size: 17px;

            font-weight: bold;

        }


        .contact-text {

            min-width: 0;

            overflow-wrap: anywhere;

            word-break: break-word;

        }


        /* =====================================================
           BOTONES
        ===================================================== */

        .actions {

            margin-top: 32px;

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .action-button {

            min-height: 44px;

            padding:
                10px
                20px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            border-radius: 50px;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border 0.2s ease;

        }


        .action-primary {

            background: var(--dorado);

            color: var(--azul-oscuro);

        }


        .action-primary:hover {

            background: var(--dorado-claro);

            transform: translateY(-2px);

        }


        .action-secondary {

            border:
                1px solid
                rgba(255,255,255,0.35);

            color: var(--blanco);

        }


        .action-secondary:hover {

            border-color: var(--dorado);

            color: var(--dorado-claro);

            transform: translateY(-2px);

        }


        /* =====================================================
           FOTO
        ===================================================== */

        .photo-section {

            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                40px
                45px
                120px
                10px;

        }


        .photo-wrapper {

            position: relative;

            width: min(380px, 100%);

            aspect-ratio: 1 / 1;

            padding: 8px;

            border-radius: 50%;

            background:

                linear-gradient(
                    135deg,
                    var(--dorado-claro),
                    var(--dorado),
                    #b67d13
                );

            box-shadow:

                0 18px 45px
                rgba(0,0,0,0.35);

        }


        .photo-wrapper::before {

            content: "";

            position: absolute;

            inset: -12px;

            border-radius: 50%;

            border:
                1px solid
                rgba(217,160,43,0.30);

        }


        .lawyer-photo {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            border-radius: 50%;

            border:
                4px solid
                var(--azul-oscuro);

            background: #e6e6e6;

        }


        /* =====================================================
           BUFETE
        ===================================================== */

        .firm {

            position: absolute;

            right: 50px;

            bottom: 27px;

            z-index: 10;

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .scales {

            width: 52px;
            height: 52px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: var(--dorado-claro);

            flex-shrink: 0;

        }


        .firm-name {

            display: flex;

            flex-direction: column;

        }


        .firm-title {

            font-size: 24px;

            line-height: 1;

            font-weight: 700;

            letter-spacing: 3px;

            color: var(--blanco);

        }


        .firm-subtitle {

            margin-top: 5px;

            font-size: 12px;

            letter-spacing: 3px;

            color: var(--gris);

        }



        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            body {

                padding: 15px;

            }


            .business-card {

                max-width: 700px;

            }


            .card-content {

                grid-template-columns: 1fr;

                min-height: auto;

            }


            .gold-line {

                display: none;

            }


            .photo-section {

                order: 1;

                padding:
                    55px
                    40px
                    30px;

            }


            .information {

                order: 2;

                padding:
                    30px
                    50px
                    120px;

                text-align: center;

            }


            .name {

                font-size: 52px;

            }


            .profession {

                font-size: 32px;

            }


            .contact-information {

                align-items: center;

            }


            .contact-item {

                width: auto;

                max-width: 100%;

                justify-content: center;

            }


            .actions {

                justify-content: center;

            }


            .firm {

                right: 50%;

                transform: translateX(50%);

                bottom: 28px;

            }

        }



        /* =====================================================
           CELULARES
        ===================================================== */

        @media (max-width: 600px) {

            body {

                min-height: 100vh;

                padding:
                    10px;

                align-items: flex-start;

            }


            .business-card {

                width: 100%;

                min-height: auto;

                border-radius: 18px;

            }


            .photo-section {

                padding:
                    38px
                    25px
                    10px;

            }


            .photo-wrapper {

                width:
                    min(
                        70vw,
                        270px
                    );

                min-width: 210px;

                padding: 7px;

            }


            .photo-wrapper::before {

                inset: -8px;

            }


            .information {

                padding:
                    30px
                    22px
                    125px;

                text-align: center;

            }


            .name {

                font-size:
                    clamp(
                        34px,
                        11vw,
                        45px
                    );

                letter-spacing: -1.5px;

                line-height: 1;

                white-space: normal;

                overflow-wrap: anywhere;

            }


            .profession {

                margin-top: 10px;

                font-size:
                    clamp(
                        23px,
                        7vw,
                        30px
                    );

                letter-spacing: 0.5px;

            }


            .contact-information {

                margin-top: 32px;

                gap: 14px;

                align-items: stretch;

            }


            .contact-item {

                width: 100%;

                justify-content: flex-start;

                text-align: left;

                font-size: 15px;

                gap: 10px;

            }


            .contact-icon {

                width: 37px;
                height: 37px;

                font-size: 15px;

            }


            .contact-text {

                flex: 1;

            }


            .actions {

                margin-top: 25px;

                flex-direction: column;

                width: 100%;

                gap: 10px;

            }


            .action-button {

                width: 100%;

                min-height: 46px;

                font-size: 14px;

            }


            .firm {

                position: absolute;

                right: 50%;

                bottom: 25px;

                transform: translateX(50%);

                width: calc(100% - 40px);

                justify-content: center;

                gap: 8px;

            }


            .scales {

                width: 38px;
                height: 38px;

            }


            .firm-title {

                font-size:
                    clamp(
                        15px,
                        4.5vw,
                        20px
                    );

                letter-spacing:
                    clamp(
                        1px,
                        0.6vw,
                        2px
                    );

            }


            .firm-subtitle {

                margin-top: 4px;

                font-size:
                    clamp(
                        8px,
                        2.5vw,
                        10px
                    );

                letter-spacing:
                    clamp(
                        1px,
                        0.5vw,
                        2px
                    );

            }

        }



        /* =====================================================
           CELULARES PEQUEÑOS
        ===================================================== */

        @media (max-width: 380px) {

            body {

                padding: 6px;

            }


            .business-card {

                border-radius: 15px;

            }


            .photo-section {

                padding-top: 28px;

            }


            .photo-wrapper {

                width: 215px;

                min-width: 0;

            }


            .information {

                padding-left: 18px;

                padding-right: 18px;

            }


            .contact-item {

                font-size: 14px;

            }


            .contact-icon {

                width: 34px;
                height: 34px;

            }


            .firm {

                width:
                    calc(100% - 25px);

            }


            .firm-title {

                font-size: 14px;

            }


            .firm-subtitle {

                font-size: 7px;

            }

        }


        /* =====================================================
           PANTALLAS MUY ALTAS / MÓVIL
        ===================================================== */

        @media (max-width: 600px) and (min-height: 750px) {

            .photo-section {

                padding-top: 55px;

            }


            .photo-wrapper {

                width:
                    min(
                        65vw,
                        290px
                    );

            }

        }


        /* =====================================================
           REDUCIR ANIMACIONES
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            * {

                scroll-behavior: auto !important;

                transition: none !important;

            }

        }

    </style>

</head>



<body>


    <!-- =====================================================
         TARJETA
    ===================================================== -->

    <main class="business-card">


        <div class="card-content">


            <!-- =================================================
                 FOTO
            ================================================= -->

            <section class="photo-section">

                <div class="photo-wrapper">

                    <!--
                    ==================================================
                    FOTO DE GITHUB
                    ==================================================

                    Sustituye esta URL por la URL RAW de tu imagen.

                    Ejemplo:

                    https://raw.githubusercontent.com/
                    USUARIO/REPOSITORIO/main/foto.jpg
                    -->

                    <img
                        class="lawyer-photo"
                        src="https://raw.githubusercontent.com/deepnode13/tarjetas-digitales/main/abogado1.jpg"
                        alt="Ricardo Soto - Abogado"
                    >

                </div>

            </section>



            <!-- =================================================
                 INFORMACIÓN
            ================================================= -->

            <section class="information">


                <div>


                    <!-- Nombre -->

                    <h1 class="name">
                        Ricardo Soto
                    </h1>


                    <!-- Profesión -->

                    <div class="profession">
                        Abogado
                    </div>



                    <!-- =================================================
                         CONTACTO
                    ================================================= -->

                    <div class="contact-information">


                        <!-- Teléfono -->

                        <a
                            class="contact-item"
                            href="tel:+525512345678"
                        >

                            <span class="contact-icon">
                                ☎
                            </span>

                            <span class="contact-text">
                                (55) 1234-5678
                            </span>

                        </a>



                        <!-- Página web -->

                        <a
                            class="contact-item"
                            href="https://www.sitioincreible.com"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            <span class="contact-icon">
                                ◉
                            </span>

                            <span class="contact-text">
                                www.sitioincreible.com
                            </span>

                        </a>



                        <!-- Correo -->

                        <a
                            class="contact-item"
                            href="mailto:hola@sitioincreible.com"
                        >

                            <span class="contact-icon">
                                ✉
                            </span>

                            <span class="contact-text">
                                hola@sitioincreible.com
                            </span>

                        </a>


                    </div>



                    <!-- =================================================
                         BOTONES
                    ================================================= -->

                    <div class="actions">


                        <a
                            class="action-button action-primary"
                            href="https://wa.me/525512345678"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            WhatsApp

                        </a>


                        <a
                            class="action-button action-secondary"
                            href="mailto:hola@sitioincreible.com"
                        >

                            Enviar correo

                        </a>


                    </div>


                </div>


            </section>


        </div>



        <!-- =====================================================
             BUFETE
        ===================================================== -->

        <div class="firm">


            <div class="scales">

                <svg
                    width="100%"
                    height="100%"
                    viewBox="0 0 100 100"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- Columna -->

                    <rect
                        x="46"
                        y="15"
                        width="8"
                        height="65"
                        rx="2"
                        fill="currentColor"
                    />


                    <!-- Base -->

                    <rect
                        x="35"
                        y="80"
                        width="30"
                        height="6"
                        rx="2"
                        fill="currentColor"
                    />


                    <rect
                        x="25"
                        y="88"
                        width="50"
                        height="5"
                        rx="2"
                        fill="currentColor"
                    />


                    <!-- Barra -->

                    <rect
                        x="25"
                        y="20"
                        width="50"
                        height="5"
                        rx="2"
                        fill="currentColor"
                    />


                    <!-- Centro -->

                    <circle
                        cx="50"
                        cy="15"
                        r="7"
                        fill="currentColor"
                    />


                    <!-- Izquierda -->

                    <line
                        x1="30"
                        y1="23"
                        x2="23"
                        y2="55"
                        stroke="currentColor"
                        stroke-width="3"
                    />

                    <line
                        x1="30"
                        y1="23"
                        x2="38"
                        y2="55"
                        stroke="currentColor"
                        stroke-width="3"
                    />


                    <!-- Derecha -->

                    <line
                        x1="70"
                        y1="23"
                        x2="62"
                        y2="55"
                        stroke="currentColor"
                        stroke-width="3"
                    />

                    <line
                        x1="70"
                        y1="23"
                        x2="77"
                        y2="55"
                        stroke="currentColor"
                        stroke-width="3"
                    />


                    <!-- Plato izquierdo -->

                    <path
                        d="M17 55H43C41 64 35 68 30 68C25 68 19 64 17 55Z"
                        fill="currentColor"
                    />


                    <!-- Plato derecho -->

                    <path
                        d="M57 55H83C81 64 75 68 70 68C65 68 59 64 57 55Z"
                        fill="currentColor"
                    />

                </svg>

            </div>


            <div class="firm-name">

                <div class="firm-title">
                    SOTO Y OCHOA
                </div>

                <div class="firm-subtitle">
                    BUFETE DE ABOGADOS
                </div>

            </div>


        </div>


    </main>


</body>

</html>
