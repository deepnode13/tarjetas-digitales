<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <meta 
        name="description" 
        content="Tarjeta digital profesional de abogado"
    >

    <title>Ricardo Soto | Abogado</title>

    <style>

        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {
            --azul-oscuro: #06285a;
            --azul-medio: #123d78;
            --azul-claro: #1e477e;

            --dorado: #d9a02b;
            --dorado-claro: #e5b341;

            --blanco: #ffffff;
            --gris: #dfe7f2;

            --sombra: 0 25px 60px rgba(0, 0, 0, 0.30);

            --radio: 24px;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #31547f 0%,
                    #071f45 45%,
                    #03142e 100%
                );

            color: var(--blanco);
        }


        /* =====================================================
           TARJETA
        ===================================================== */

        .business-card {

            position: relative;

            width: 100%;
            max-width: 1050px;

            min-height: 590px;

            overflow: hidden;

            border-radius: var(--radio);

            background:
                linear-gradient(
                    135deg,
                    rgba(18, 61, 120, 0.98),
                    rgba(3, 25, 58, 0.98)
                );

            box-shadow: var(--sombra);

            border: 1px solid rgba(255,255,255,0.08);

            isolation: isolate;
        }


        /* =====================================================
           ELEMENTOS DECORATIVOS
        ===================================================== */

        .business-card::before {

            content: "";

            position: absolute;

            width: 600px;
            height: 600px;

            right: -280px;
            top: -250px;

            border-radius: 50%;

            border: 1px solid rgba(217,160,43,0.15);

            z-index: -1;
        }


        .business-card::after {

            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            left: -300px;
            bottom: -250px;

            border-radius: 50%;

            background: rgba(217,160,43,0.04);

            z-index: -1;
        }


        /* =====================================================
           LINEA DORADA
        ===================================================== */

        .gold-line {

            position: absolute;

            left: 0;
            right: 0;

            top: 290px;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--dorado),
                    var(--dorado-claro),
                    var(--dorado)
                );

            z-index: 1;
        }


        /* =====================================================
           CONTENIDO PRINCIPAL
        ===================================================== */

        .card-content {

            position: relative;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                430px;

            min-height: 590px;
        }


        /* =====================================================
           INFORMACIÓN
        ===================================================== */

        .information {

            padding: 75px 20px 55px 80px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            z-index: 2;
        }


        .name-section {
            margin-bottom: 30px;
        }


        .name {

            font-size: clamp(42px, 5vw, 62px);

            line-height: 0.95;

            font-weight: 700;

            letter-spacing: -2px;

            color: var(--blanco);
        }


        .profession {

            margin-top: 12px;

            font-size: clamp(25px, 3vw, 38px);

            font-weight: 700;

            line-height: 1;

            color: var(--dorado-claro);

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* =====================================================
           CONTACTO
        ===================================================== */

        .contact-information {

            margin-top: 45px;

            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        .contact-item {

            display: flex;

            align-items: center;

            gap: 15px;

            color: var(--blanco);

            text-decoration: none;

            font-size: 20px;

            transition:
                transform 0.25s ease,
                color 0.25s ease;
        }


        .contact-item:hover {

            transform: translateX(6px);

            color: var(--dorado-claro);
        }


        .contact-icon {

            width: 42px;
            height: 42px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--blanco);

            color: var(--azul-oscuro);

            font-size: 19px;

            font-weight: bold;
        }


        /* =====================================================
           FOTO
        ===================================================== */

        .photo-section {

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 50px 45px 50px 10px;

            z-index: 3;
        }


        .photo-wrapper {

            position: relative;

            width: min(380px, 100%);

            aspect-ratio: 1 / 1;

            border-radius: 50%;

            padding: 8px;

            background:
                linear-gradient(
                    135deg,
                    var(--dorado-claro),
                    var(--dorado),
                    #b57b13
                );

            box-shadow:
                0 15px 45px rgba(0,0,0,0.35);
        }


        .photo-wrapper::before {

            content: "";

            position: absolute;

            inset: -14px;

            border-radius: 50%;

            border: 1px solid rgba(217,160,43,0.25);
        }


        .lawyer-photo {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid var(--azul-oscuro);

            background: #e6e6e6;
        }


        /* =====================================================
           FIRMA / BUFETE
        ===================================================== */

        .firm {

            position: absolute;

            right: 55px;

            bottom: 28px;

            display: flex;

            align-items: center;

            gap: 15px;

            z-index: 5;
        }


        .scales {

            width: 55px;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: var(--dorado-claro);
        }


        .firm-name {

            display: flex;

            flex-direction: column;
        }


        .firm-title {

            font-size: 25px;

            font-weight: 700;

            letter-spacing: 3px;

            color: var(--blanco);
        }


        .firm-subtitle {

            margin-top: 3px;

            font-size: 13px;

            letter-spacing: 3px;

            color: var(--gris);
        }


        /* =====================================================
           BOTONES
        ===================================================== */

        .actions {

            display: flex;

            gap: 12px;

            margin-top: 35px;
        }


        .action-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 11px 18px;

            border-radius: 50px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: all 0.25s ease;
        }


        .action-primary {

            background: var(--dorado);

            color: var(--azul-oscuro);
        }


        .action-primary:hover {

            background: var(--dorado-claro);

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }


        .action-secondary {

            border: 1px solid rgba(255,255,255,0.3);

            color: var(--blanco);
        }


        .action-secondary:hover {

            border-color: var(--dorado);

            color: var(--dorado-claro);

            transform: translateY(-2px);
        }


        /* =====================================================
           RESPONSIVE - TABLET
        ===================================================== */

        @media (max-width: 900px) {

            body {
                padding: 20px;
            }

            .business-card {
                min-height: auto;
            }

            .card-content {

                grid-template-columns: 1fr;

                min-height: auto;
            }

            .gold-line {
                display: none;
            }

            .information {

                padding:
                    50px
                    45px
                    30px;
            }

            .photo-section {

                padding:
                    10px
                    45px
                    120px;
            }

            .photo-wrapper {

                width: 300px;
            }

            .firm {

                right: 50%;

                transform: translateX(50%);

                bottom: 30px;

                white-space: nowrap;
            }
        }


        /* =====================================================
           RESPONSIVE - CELULAR
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .business-card {

                border-radius: 18px;
            }

            .information {

                padding:
                    40px
                    25px
                    20px;
            }

            .name {

                font-size: 43px;

                letter-spacing: -1.5px;
            }

            .profession {

                font-size: 27px;
            }

            .contact-information {

                margin-top: 35px;

                gap: 16px;
            }

            .contact-item {

                font-size: 16px;

                gap: 11px;

                word-break: break-word;
            }

            .contact-icon {

                width: 38px;
                height: 38px;

                font-size: 16px;
            }

            .photo-section {

                padding:
                    20px
                    25px
                    120px;
            }

            .photo-wrapper {

                width: 260px;
            }

            .actions {

                flex-direction: column;
            }

            .action-button {

                width: 100%;
            }

            .firm {

                right: 50%;

                bottom: 25px;

                transform: translateX(50%);

                gap: 8px;
            }

            .scales {

                width: 40px;

                height: 40px;
            }

            .firm-title {

                font-size: 17px;

                letter-spacing: 2px;
            }

            .firm-subtitle {

                font-size: 9px;

                letter-spacing: 2px;
            }
        }

    </style>
</head>


<body>
