<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepNode | Tarjeta Digital</title>
    <!-- Google Fonts: Orbitron (titulos tech) e Inter (lectura) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #050811;
            --card-bg: rgba(10, 16, 30, 0.85);
            --cyan-glow: #00f0ff;
            --purple-glow: #7000ff;
            --green-cyber: #00ff66;
            --text-white: #f0f6fc;
            --text-dim: #8b949e;
            --border-neon: rgba(0, 240, 255, 0.3);
            --font-tech: 'Orbitron', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --font-main: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo Animado Cyber */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
                linear-gradient(rgba(5, 8, 17, 0.92), rgba(5, 8, 17, 0.92)),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 240, 255, 0.03) 3px, rgba(0, 240, 255, 0.03) 3px);
            z-index: -1;
            background-size: cover, cover, cover, 100% 4px;
        }

        /* Contenedor Principal Responsive */
        .card-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--border-neon);
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.15),
                inset 0 0 15px rgba(0, 240, 255, 0.05);
            overflow: hidden;
            position: relative;
        }

        /* Encabezado */
        .card-header {
            padding: 35px 20px 20px;
            text-align: center;
            position: relative;
        }

        /* Badge Status */
        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: var(--green-cyber);
            font-family: var(--font-code);
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--green-cyber);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green-cyber);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Logo de la Empresa */
        .logo-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--cyan-glow) 0%, transparent 70%);
            opacity: 0.25;
            filter: blur(10px);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 20px;
            border: 2px solid var(--border-neon);
            padding: 8px;
            background: rgba(5, 8, 17, 0.8);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            position: relative;
            z-index: 1;
        }

        /* Título de la Empresa */
        .company-name {
            font-family: var(--font-tech);
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 6px;
        }

        .company-name span {
            color: var(--cyan-glow);
        }

        .company-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-family: var(--font-code);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .company-desc i {
            color: var(--purple-glow);
        }

        /* Sección de Botones Interactivos */
        .links-container {
            padding: 10px 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 14px 18px;
            border-radius: 14px;
            color: var(--text-white);
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .nav-btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            background: rgba(0, 240, 255, 0.08);
            color: var(--cyan-glow);
            border: 1px solid rgba(0, 240, 255, 0.2);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .btn-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-white);
        }

        .btn-subtitle {
            font-size: 0.72rem;
            color: var(--text-dim);
            font-family: var(--font-code);
            margin-top: 1px;
        }

        .arrow-box {
            color: var(--text-dim);
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            border-color: var(--cyan-glow);
            background: rgba(0, 240, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.15);
        }

        .nav-btn:hover .icon-box {
            background: var(--cyan-glow);
            color: #050811;
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .nav-btn:hover .arrow-box {
            color: var(--cyan-glow);
            transform: translateX(4px);
        }

        .btn-vcard {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.12), rgba(112, 0, 255, 0.12));
            border-color: rgba(0, 240, 255, 0.3);
        }

        .btn-whatsapp .icon-box {
            color: #25D366;
            border-color: rgba(37, 211, 102, 0.3);
            background: rgba(37, 211, 102, 0.1);
        }

        .btn-whatsapp:hover {
            border-color: #25D366;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.15);
        }

        .btn-whatsapp:hover .icon-box {
            background: #25D366;
            color: #050811;
            box-shadow: 0 0 12px #25D366;
        }

        /* Grid Redes Sociales */
        .social-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-white);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .social-btn.fb:hover {
            border-color: #1877F2;
            background: rgba(24, 119, 242, 0.15);
            color: #1877F2;
            box-shadow: 0 0 12px rgba(24, 119, 242, 0.2);
        }

        .social-btn.ig:hover {
            border-color: #E4405F;
            background: rgba(228, 64, 95, 0.15);
            color: #E4405F;
            box-shadow: 0 0 12px rgba(228, 64, 95, 0.2);
        }

        /* Footer */
        .card-footer {
            padding: 15px;
            text-align: center;
            font-family: var(--font-code);
            font-size: 0.68rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.2);
        }

        .card-footer span {
            color: var(--cyan-glow);
        }
    </style>
</head>
<body>

    <div class="card-container">

            <div class="logo-wrapper">

        <!-- Footer -->
        <div class="card-footer">

    <!-- Script de descarga vCard -->
    <script>
        function downloadVCard() {
            const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:DeepNode
ORG:DeepNode - Automatización de Procesos
TITLE:Soluciones de Automatización e IA
TEL;TYPE=CELL,VOICE:+447988951706
EMAIL;TYPE=INTERNET,PREF:deepnodeagency@gmail.com
URL:https://deepnode13.github.io/deepnode/index.html
NOTE:Expertos en Automatización de Procesos e Inteligencia Artificial.
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'DeepNode_Contacto.vcf';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
