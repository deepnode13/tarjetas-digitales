<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> - Tarjeta Digital</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 30px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-color);
      margin-bottom: 15px;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }
    p.title { font-size: 0.9rem; color: var(--accent-color); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
    .btn-container { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-whatsapp { background-color: #25D366; color: #fff; }
    .btn-call { background-color: #3b82f6; color: #fff; }
    .btn-email { background-color: #ea4335; color: #fff; }
    .btn-linkedin { background-color: #0a66c2; color: #fff; }
    .footer { margin-top: 25px; font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="card">
    <img src="" alt="Foto de " class="profile-img">
    <h1></h1>
    <p class="title"></p>
    <div class="btn-container">
      <a href="https://wa.me/" target="_blank" class="btn btn-whatsapp">💬 Enviar WhatsApp</a>
      <a href="tel:+" class="btn btn-call">📞 Llamar por Teléfono</a>
      <a href="mailto:" class="btn btn-email">✉️ Enviar Correo</a>
      <a href="" target="_blank" class="btn btn-linkedin">🔗 Ver LinkedIn</a>
    </div>
    <div class="footer">
      <p>Tarjeta Digital de Presentación</p>
    </div>
  </div>
</body>
</html>
