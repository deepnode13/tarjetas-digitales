<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital - Ricardo Soto | Abogado</title>
    <!-- Fuente Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Iconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-navy: #11284b;
            --secondary-navy: #1a365d;
            --accent-gold: #c69214;
            --accent-gold-hover: #e0a81e;
            --text-white: #ffffff;
            --text-light: #e2e8f0;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0b1727;
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal de la Tarjeta */
        .card-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #162c4e, #0e1e36);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(198, 146, 20, 0.3);
            position: relative;
        }

        /* Encabezado con Fondo Temático */
        .card-header {
            position: relative;
            background: linear-gradient(rgba(17, 40, 75, 0.88), rgba(17, 40, 75, 0.95)), 
                        url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 3px solid var(--accent-gold);
        }

        /* Logo Bufete (Inspirado en Imagen 2) */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo-icon {
            color: var(--accent-gold);
            font-size: 2.2rem;
        }

        .logo-text {
            text-align: left;
        }

        .logo-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-white);
            line-height: 1.1;
            text-transform: uppercase;
        }

        .logo-subtitle {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--text-light);
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Foto de Perfil con Marco Dorado (Inspirado en Imagen 1) */
        .profile-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--accent-gold);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        /* Información Personal */
        .user-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 4px;
        }

        .user-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Botones de Acción Directa */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px 20px 10px;
        }

        .btn-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--accent-gold);
            color: #0d1b2a;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-action:hover {
            background-color: var(--accent-gold-hover);
            transform: translateY(-2px);
        }

        /* Lista de Contacto */
        .contact-list {
            padding: 15px 25px 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-white);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .contact-item:hover {
            background: rgba(198, 146, 20, 0.15);
            border-color: var(--accent-gold);
            transform: translateX(4px);
        }

        .icon-box {
            width: 38px;
            height: 38px;
            background-color: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d1b2a;
            font-size: 1rem;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .contact-label {
            font-size: 0.7rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .contact-value {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Footer / Redes Sociales */
        .card-footer {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.2);
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-white);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: var(--accent-gold);
            color: #0d1b2a;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Encabezado -->
        <div class="card-header">
            <!-- Logo del Bufete -->
            <div class="logo-container">
                <i class="fa-solid fa-scale-balanced logo-icon"></i>
                <div class="logo-text">
                    <div class="logo-title">Soto y Ochoa</div>
                    <div class="logo-subtitle">Bufete de Abogados</div>
                </div>
            </div>

            <!-- Foto de Perfil -->
            <div class="profile-wrapper">
                <!-- REEMPLAZA EL 'src' CON LA URL RAW DE TU FOTO EN GITHUB -->
                <img src="https://raw.githubusercontent.com/deepnode13/tarjetas-digitales/main/abogado.jpg" alt="Ricardo Soto" class="profile-img">
            </div>

            <!-- Información del Abogado -->
            <h1 class="user-name">Ricardo Soto</h1>
            <p class="user-title">Abogado</p>
        </div>

        <!-- Botones de Acción Rápida -->
        <div class="action-buttons">
            <a href="tel:5512345678" class="btn-action">
                <i class="fa-solid fa-phone"></i> Llamar
            </a>
            <a href="https://wa.me/525512345678" target="_blank" class="btn-action">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
        </div>

        <!-- Información de Contacto -->
        <div class="contact-list">
            <a href="tel:5512345678" class="contact-item">
                <div class="icon-box">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <div class="contact-details">
                    <span class="contact-label">Teléfono</span>
                    <span class="contact-value">(55) 1234-5678</span>
                </div>
            </a>

            <a href="https://www.sitioincreible.com" target="_blank" class="contact-item">
                <div class="icon-box">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div class="contact-details">
                    <span class="contact-label">Sitio Web</span>
                    <span class="contact-value">www.sitioincreible.com</span>
                </div>
            </a>

            <a href="mailto:hola@sitioincreible.com" class="contact-item">
                <div class="icon-box">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="contact-details">
                    <span class="contact-label">Correo Electrónico</span>
                    <span class="contact-value">hola@sitioincreible.com</span>
                </div>
            </a>
        </div>

        <!-- Redes Sociales -->
        <div class="card-footer">
            <div class="social-links">
                <a href="#" class="social-btn" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#" class="social-btn" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="social-btn" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </div>

</body>
</html>
